<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="1040" height="430" rx="12" fill="#0d1117"/><path d="M 0 44 L 0 12 A 12 12 0 0 1 12 0 L 1028 0 A 12 12 0 0 1 1040 12 L 1040 44 Z" fill="#161b22"/><line x1="0" y1="44" x2="1040" y2="44" stroke="#30363d" stroke-width="1"/><circle cx="26" cy="22" r="7" fill="#ff5f56" stroke="none" stroke-width="2"/><circle cx="48" cy="22" r="7" fill="#ffbd2e" stroke="none" stroke-width="2"/><circle cx="70" cy="22" r="7" fill="#27c93f" stroke="none" stroke-width="2"/><text x="520.0" y="28" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">xr — 息壤 CLI</text><text x="28" y="82" font-size="15" fill="#c9d1d9" font-weight="600" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">$ xr tree 词库.xirang --head 6</text><text x="28" y="108" font-size="15" fill="#79c0ff" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">光源 = 能发光的物体</text><text x="28" y="134" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace"></text><text x="28" y="148" font-size="15" fill="#79c0ff" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">灯 =</text><text x="28" y="174" font-size="15" fill="#8b949e" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">   ├─ 词形 = 灯</text><text x="28" y="200" font-size="15" fill="#8b949e" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">   ├─ 词频 = 2046</text><text x="28" y="226" font-size="15" fill="#8b949e" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">   └─ 父类 = → 光源</text><text x="28" y="264" font-size="15" fill="#c9d1d9" font-weight="600" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">$ xr cat 词库.xirang --head 3</text><text x="28" y="290" font-size="15" fill="#79c0ff" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">光源 = 能发光的物体</text><text x="28" y="316" font-size="15" fill="#79c0ff" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">灯 =</text><text x="28" y="342" font-size="15" fill="#79c0ff" font-weight="400" text-anchor="start" font-family="SF Mono, Menlo, Consolas, monospace">词形 = 灯</text><text x="28" y="408" font-size="13" fill="#6e7681" font-weight="400" text-anchor="start">tree = 缩进树　·　cat = 一行一个节点（像看文本）　·　--head N = 只看前 N 个</text></svg>