<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1240" height="690" rx="14" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text x="40" y="56" font-size="26" fill="#1f2328" font-weight="600" text-anchor="start">一个节点，可以长成任何结构</text><text x="40" y="86" font-size="16" fill="#57606a" font-weight="400" text-anchor="start">节点只有四样东西；树与图都由它派生；编号全局唯一，所以可以跨文件</text><rect x="40" y="116" width="340" height="278" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="60" y="150" font-size="18" fill="#0969da" font-weight="600" text-anchor="start">① 一个节点</text><rect x="60" y="164" width="72" height="26" rx="6" fill="#ddf4ff"/><text x="72" y="182" font-size="14" fill="#0969da" font-weight="600" text-anchor="start">编号</text><text x="144" y="182" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">550e8400-…（16 字节 UUID）</text><rect x="60" y="202" width="72" height="26" rx="6" fill="#ddf4ff"/><text x="72" y="220" font-size="14" fill="#0969da" font-weight="600" text-anchor="start">父节点</text><text x="144" y="220" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">指向父节点的编号；全 0 = 根</text><rect x="60" y="240" width="72" height="26" rx="6" fill="#ddf4ff"/><text x="72" y="258" font-size="14" fill="#0969da" font-weight="600" text-anchor="start">名字</text><text x="144" y="258" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">「灯」</text><rect x="60" y="278" width="72" height="26" rx="6" fill="#ddf4ff"/><text x="72" y="296" font-size="14" fill="#0969da" font-weight="600" text-anchor="start">值</text><text x="144" y="296" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">2046／「照明器具」／→ 光源</text><text x="60" y="378" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">值的 7 大类：空 · 整数 · 浮点 · 布尔 · 文本 · 引用 · 二进制块</text><rect x="408" y="116" width="340" height="278" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="428" y="150" font-size="18" fill="#1a7f37" font-weight="600" text-anchor="start">② 父边 → 树</text><line x1="578" y1="220" x2="498" y2="282" stroke="#d0d7de" stroke-width="2"/><line x1="578" y1="220" x2="658" y2="282" stroke="#d0d7de" stroke-width="2"/><line x1="498" y1="282" x2="498" y2="344" stroke="#d0d7de" stroke-width="2"/><circle cx="578" cy="220" r="12" fill="#1a7f37" stroke="none" stroke-width="2"/><text x="598" y="225" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">根</text><circle cx="498" cy="282" r="12" fill="#1a7f37" stroke="none" stroke-width="2"/><text x="518" y="287" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">子</text><circle cx="658" cy="282" r="12" fill="#1a7f37" stroke="none" stroke-width="2"/><text x="678" y="287" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">子</text><circle cx="498" cy="344" r="12" fill="#1a7f37" stroke="none" stroke-width="2"/><text x="518" y="349" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">孙</text><text x="428" y="378" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">每个节点的父节点指向谁，谁就是它的上层</text><rect x="776" y="116" width="340" height="278" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="796" y="150" font-size="18" fill="#9a6700" font-weight="600" text-anchor="start">③ 引用边 → 图</text><circle cx="866" cy="224" r="13" fill="#1a7f37" stroke="none" stroke-width="2"/><text x="884" y="229" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">灯</text><circle cx="1026" cy="224" r="13" fill="#8250df" stroke="none" stroke-width="2"/><text x="1044" y="229" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">光源</text><path d="M 881 236 C 936 284, 956 284, 1011 236" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="6 5"/><text x="946" y="310" font-size="13" fill="#9a6700" font-weight="400" text-anchor="middle">父类 = → 光源</text><text x="796" y="378" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">引用可以指向任何节点，于是树连成了图</text><rect x="40" y="414" width="1160" height="226" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="60" y="448" font-size="18" fill="#8250df" font-weight="600" text-anchor="start">④ 跨文件，并按编号直接定位</text><rect x="60" y="470" width="220" height="124" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="78" y="498" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start">常用词库.xirang</text><text x="78" y="526" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">猫 = （空）</text><text x="78" y="550" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">   ├─ 别名 = 猫咪</text><text x="78" y="572" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">   └─ 常伴 = → 狗</text><rect x="356" y="470" width="220" height="124" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="374" y="498" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start">生物词库.xirang</text><text x="374" y="526" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">猫 = （空）</text><text x="374" y="550" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">   ├─ 科 = → 猫科</text><text x="374" y="572" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">   └─ 属 = → 猫属</text><path d="M 284 532 L 352 532" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5"/><text x="318" y="520" font-size="12" fill="#8250df" font-weight="400" text-anchor="middle">同一个编号</text><rect x="608" y="470" width="572" height="124" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="630" y="500" font-size="15" fill="#1f2328" font-weight="600" text-anchor="start">磁盘索引：把全部节点编号排好序</text><text x="630" y="530" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">查一个编号 = 只读磁盘上十几条小记录，不把文件读进内存</text><text x="630" y="560" font-size="13" fill="#0969da" font-weight="600" text-anchor="start">实测：347 万节点（179 MB）的文件，取一个节点约 28 ms</text></svg>