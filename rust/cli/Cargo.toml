[package]
name = "xirang-cli"
version = "0.4.0"
edition = "2021"
description = "息壤（XiRang）CLI：xr 命令"

[lib]
name = "xirang_cli"
path = "src/lib.rs"

[[bin]]
name = "xr"
path = "src/main.rs"

[[bin]]
name = "xr-mcp"
path = "src/mcp.rs"

[dependencies]
libc = "0.2.189"
serde_json = "1"
xirang-core = { path = "../core" }
