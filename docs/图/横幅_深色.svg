<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="1280" height="320" rx="14" fill="#0d1117"/><text x="72" y="116" font-size="58" fill="#ffffff" font-weight="700" text-anchor="start">息壤</text><text x="224" y="116" font-size="40" fill="#ffffff" font-weight="300" text-anchor="start" letter-spacing="1">XiRang</text><text x="72" y="168" font-size="26" fill="#58a6ff" font-weight="500" text-anchor="start">一种极小的节点语言格式</text><text x="72" y="212" font-size="19" fill="#8b949e" font-weight="400" text-anchor="start">节点只有四样东西：编号 · 父节点 · 名字 · 值</text><text x="72" y="250" font-size="19" fill="#8b949e" font-weight="400" text-anchor="start">可组织成任意树与图 · 编号全局唯一 · 可跨文件引用</text><line x1="1050" y1="104" x2="970" y2="170" stroke="#30363d" stroke-width="2"/><line x1="1050" y1="104" x2="1130" y2="170" stroke="#30363d" stroke-width="2"/><line x1="970" y1="170" x2="970" y2="236" stroke="#30363d" stroke-width="2"/><circle cx="1050" cy="104" r="13" fill="#1f6feb" stroke="none" stroke-width="2"/><circle cx="970" cy="170" r="11" fill="#238636" stroke="none" stroke-width="2"/><circle cx="1130" cy="170" r="11" fill="#238636" stroke="none" stroke-width="2"/><circle cx="970" cy="236" r="9" fill="#238636" stroke="none" stroke-width="2"/><path d="M 1130 170 C 1220 170, 1220 266, 1144 266" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 5"/><circle cx="1130" cy="266" r="10" fill="#58a6ff" stroke="none" stroke-width="2"/><text x="1146" y="272" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start">另一个文件</text><text x="938" y="310" font-size="14" fill="#8b949e" font-weight="400" text-anchor="start">父边 = 树　·　引用边 = 图　·　编号跨文件唯一</text></svg>