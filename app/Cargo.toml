[package]
name = "xirang-app"
version = "0.1.0"
edition = "2021"
description = "息壤桌面阅读编辑工具（Rust + egui，依赖内核 v1.0）"

[dependencies]
xirang-core = { path = "../rust/core" }
# 桌面端复用 CLI 的共享操作层（同一条实现，不另写一套）
xirang-cli = { path = "../rust/cli" }
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.16"
# 图片预览：只认 PNG / JPEG，按需解码（不把整张图常驻内存）
png = "0.18"
zune-jpeg = "0.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
serde_json = "1"
