name: 测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装测试依赖
        run: python3 -m pip install --quiet --upgrade pip pytest pyyaml

      - name: Python 测试（参考实现）
        run: python3 -m pytest tests/ -q

      - name: Rust 测试（交付实现）
        run: cargo test --manifest-path rust/Cargo.toml

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 桌面端编译检查（Rust + egui）
        run: cargo check --manifest-path app/Cargo.toml

      - name: 桌面端逻辑测试（懒加载 / 摊平 / 追加编辑）
        run: cargo test --manifest-path app/Cargo.toml
