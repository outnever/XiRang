name: 测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装测试依赖
        run: python3 -m pip install --quiet --upgrade pip pytest pyyaml

      - name: Python 测试（参考实现）
        run: python3 -m pytest tests/ -q

      - name: Rust 测试（交付实现）
        run: cargo test --manifest-path rust/Cargo.toml

      - name: 索引对比基准（1 万 / 10 万节点 + 断言）
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          ./rust/target/release/xr-bench run \
            --out /tmp/xr-bench --nodes 10000,100000 --reps 1 \
            --bin-dir rust/target/release --assert
